name: Rust course
on: [push, pull_request]
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --all-targets
      - run: cargo test --features reference
      - run: test "$(cargo run --quiet --example study_log --features reference)" = '2 sessions, 65 minutes'
